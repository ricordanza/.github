# .gemini/config.yaml のサンプル

# 使用する Gemini モデルを指定します。
# 利用可能なモデルについては、公式ドキュメントを参照してください。
model: 'gemini-2.5-flash'

# （オプション）生成されるコードやレビューの安全設定を調整します。
# 不快なコンテンツなどの生成を制限できます。
config:
  safetySettings:
    # ハラスメント関連のコンテンツを「高い」確度でのみブロックする設定例
    - category: HARM_CATEGORY_HARASSMENT
      threshold: BLOCK_ONLY_HIGH
    # 嫌悪表現関連のコンテンツを「高い」確度でのみブロックする設定例
    - category: HARM_CATEGORY_HATE_SPEECH
      threshold: BLOCK_ONLY_HIGH

# （オプション）カスタムのスタイルガイドファイルへのパスを指定します。
# Gemini Code Assist は、このガイドラインに従ってレビューや提案を行います。
# 例: リポジトリのルートにある styleguide.md を使用する場合
styleGuidePath: '.gemini/styleguide.md'

# （オプション）Gemini がコード生成やレビュー時に参照する追加のコンテキスト情報。
# 他のリポジトリや特定のファイルへの参照を含めることができます。
# 例:
# context:
#   - type: remote_repo
#     uri: 'github.com'
#   - type: file
#     path: './docs/introduction.md'
